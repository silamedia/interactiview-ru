<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проверка обычной вставки YouTube</title>
</head>
<body style="font:16px/1.5 system-ui;max-width:900px;margin:24px auto;padding:0 16px">
  <h1>Обычная вставка YouTube с 6:26</h1>
  <p>Один iframe уже находится в HTML страницы. Нажмите Play внутри YouTube.</p>
  <iframe
    width="900"
    height="506"
    src="https://www.youtube.com/embed/nIE6WajF7vk?start=386"
    title="Дети больше не читают? Зачем сегодня ходить в школу"
    style="max-width:100%;aspect-ratio:16/9;border:0"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen
  ></iframe>
</body>
</html>
