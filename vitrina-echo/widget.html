<script>(function(){"use strict";const S=`.sfi {
  max-width: 100%;
}

.sfi *,
.sfi *::before,
.sfi *::after {

}

.sfi__title {
  margin: 0 0 8px;
}

.sfi__description {
  max-width: 72ch;
  margin: 0 0 18px;
}

.sfi__layout {
  display: grid;
  grid-template-columns: minmax(320px, 1fr);
  gap: 14px;
  align-items: start;
}

.sfi--side .sfi__layout {
  grid-template-columns: minmax(320px, 1fr) minmax(240px, 0.42fr);
}

.sfi__media {
  position: relative;
  overflow: hidden;
  border: 0;
  border-radius: 0;
  background: #111;
}

.sfi__media::before {
  display: block;
  padding-top: 56.25%;
  content: "";
}

.sfi__poster,
.sfi__player,
.sfi__player iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.sfi__poster {
  object-fit: cover;
}

.sfi__player {
  z-index: 1;
}

.sfi__questions-panel {
  min-width: 0;
}

.sfi__help {
  margin: 0 0 8px;
  opacity: 0.65;
  font-size: 0.875em;
}

.sfi__questions {
  display: grid;
  gap: 0;
  margin: 0;
  padding: 0;
  list-style: none;
}

  gap: 3px;

  border: 0;

  color: inherit;
  background: transparent;
}

.sfi__question-button:focus-visible {
  outline: 2px solid currentColor;
  outline-offset: 1px;
}

.sfi__question-text {
  color: inherit;
}

.sfi__source {
  opacity: 0.65;
  font-size: 0.875em;
}

.sfi__empty {
  padding: 12px;
}

.sfi__branding {
  margin: 6px 0 0;
  font-size: 10px;
  line-height: 1.2;
  opacity: 0.55;
  text-align: right;
}

.sfi__branding a {
  color: inherit;
  text-decoration: none;
  border: 0;
  font-size: inherit;
  font-weight: 400;
}

.sfi__branding a:hover {
  opacity: 1;
}

@media (max-width: 720px) {
  .sfi--side .sfi__layout,
  .sfi__layout {
    grid-template-columns: 1fr;
  }

  .sfi__branding {
    text-align: left;
  }
}
