<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Витрина «Давайте разберёмся»: прототип</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* Layout: вертикальный сюжет: архив эфиров -> расшифровка и нарезка -> витрина с интерактивью -> деньги. Вторая вкладка: карта системы. */
:root {
  --bg: #f5f6f8;
  --card: #ffffff;
  --ink: #12141a;
  --muted: #5d6370;
  --line: #dfe2e8;
  --blue: #1f4fff;
  --blue-soft: #e8edff;
  --amber: #b45309;
  --amber-soft: #fdf0dc;
  --player: #12141a;
  --on-player: #f1f3f7;
  --font-text: 'Golos Text', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1014; --card: #171a21; --ink: #eef0f4; --muted: #9aa1ae; --line: #2a2f3a;
    --blue: #7f9bff; --blue-soft: #1c2547; --amber: #f0a85a; --amber-soft: #3a2a14; --player: #05060a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1014; --card: #171a21; --ink: #eef0f4; --muted: #9aa1ae; --line: #2a2f3a;
  --blue: #7f9bff; --blue-soft: #1c2547; --amber: #f0a85a; --amber-soft: #3a2a14; --player: #05060a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-text); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
h1 { font-size: clamp(26px, 4.4vw, 42px); font-weight: 800; line-height: 1.08; margin: 0 0 8px; text-wrap: balance; max-width: 22ch; letter-spacing: -.01em; }
.lead { color: var(--muted); max-width: 66ch; margin: 0 0 20px; font-size: 15px; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.tabs { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
.tab { background: transparent; border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 600; }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.step { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 0 14px; }
.step > .num { font: 500 13px var(--font-mono); width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--ink); display: grid; place-items: center; margin-top: 2px; }
.step h2 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.25; }
.step .sub { margin: 2px 0 12px; color: var(--muted); max-width: 72ch; }
.rail { position: relative; }
.rail::before { content: ""; position: absolute; left: 15px; top: 36px; bottom: -4px; border-left: 1.5px solid var(--line); }
.step:last-child .rail::before { display: none; }
.step > div:last-child { padding-bottom: 26px; min-width: 0; }

.wall { margin: -8px 0 24px 50px; display: flex; align-items: center; gap: 12px; color: var(--ink); }
.wall::before, .wall::after { content: ""; flex: 1; border-top: 3px dashed var(--ink); }
.wall span { flex: none; max-width: 70%; text-align: center; }

.tag { display: inline-block; font: 500 10px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; padding: 3px 7px; border-radius: 4px; border: 1px solid; }
.tag.ed { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
.tag.st { color: var(--ink); border-color: var(--ink); background: var(--card); }
.tag.ad { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 22px; color: var(--muted); font-size: 13px; }

/* question picker */
.qpick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
.qpick .mono { color: var(--muted); width: 100%; }
.qp { border: 1.5px solid var(--line); background: var(--card); border-radius: 100px; padding: 6px 12px; cursor: pointer; font-size: 13px; text-align: left; }
.qp:hover { border-color: var(--ink); }
.qp[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 600; }

.archive { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 16px; }
.arow { display: grid; grid-template-columns: minmax(170px, 270px) minmax(0, 1fr); gap: 4px 18px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.arow:last-child { border-bottom: 0; }
.arow b { display: block; font-weight: 600; font-size: 13px; line-height: 1.3; margin-top: 4px; }
.arow small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 2px; }
.track { position: relative; height: 24px; border-radius: 4px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 8.333%), color-mix(in srgb, var(--line) 45%, transparent); }
.seg { position: absolute; top: 0; bottom: 0; min-width: 22px; border: 0; border-radius: 4px; background: var(--blue); opacity: .55; color: #fff; font: 500 11px var(--font-mono); cursor: pointer; display: grid; place-items: center; padding: 0; }
.seg:hover { opacity: .85; }
.seg[aria-pressed="true"] { opacity: 1; outline: 2px solid var(--ink); outline-offset: 1px; z-index: 1; }
.more { margin-top: 8px; color: var(--muted); font-size: 12px; }

.cut { background: var(--card); border: 1px dashed var(--ink); border-radius: 12px; padding: 14px 16px; display: grid; gap: 12px; }
.tx { font: 400 12px/1.5 var(--font-mono); display: grid; gap: 2px; }
.tx .cue { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 3px 6px; border-radius: 4px; background: var(--blue-soft); }
.tx .cue i { font-style: normal; color: var(--blue); }
.tx .cue span { min-width: 0; overflow-wrap: anywhere; }
.tx .gap { color: var(--muted); padding: 2px 6px; }
.chain { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; }
.chain span.s { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
.chain span.s.on { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); font-weight: 600; }
.chain i { color: var(--muted); font-style: normal; }

.page { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.chrome { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--bg); }
.chrome .dots { display: flex; gap: 5px; } .chrome .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.chrome .url { font: 400 12px var(--font-mono); color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pbody { padding: 16px; display: grid; gap: 18px; }
.area { position: relative; border-radius: 10px; transition: opacity .15s, box-shadow .15s; }
.area > .tag { position: absolute; top: -9px; left: 10px; z-index: 2; }
.page.focus .area { opacity: .35; }
.page.focus .area.hl { opacity: 1; box-shadow: 0 0 0 3px var(--amber); }
.ptitle { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 14px; align-items: baseline; }
.ptitle h3 { margin: 0; font-size: clamp(20px, 3vw, 28px); font-weight: 800; letter-spacing: -.01em; line-height: 1.15; }
.sponsor { border: 1.5px dashed var(--amber); background: var(--amber-soft); color: var(--amber); padding: 12px 14px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; font-weight: 600; font-size: 13px; }
.sponsor b { font-weight: 600; color: var(--ink); }

.module { border: 1.5px solid var(--blue); padding: 14px; display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; background: var(--card); }
.player { display: grid; gap: 8px; align-content: start; min-width: 0; }
.screen { position: relative; aspect-ratio: 16 / 9; background: var(--player); color: var(--on-player); border-radius: 8px; overflow: hidden; display: grid; align-content: center; justify-items: center; background-image: radial-gradient(ellipse at 30% 20%, rgba(127,155,255,.22), transparent 55%); }
.screen .play { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--on-player); background: rgba(255,255,255,.08); cursor: pointer; display: grid; place-items: center; margin-bottom: 10px; }
.screen .play svg { width: 22px; height: 22px; fill: var(--on-player); }
.screen .sub { width: 86%; text-align: center; font-size: clamp(12px, 1.7vw, 16px); line-height: 1.35; margin: 0 0 4px; text-wrap: balance; }
.screen .cap { position: absolute; left: 12px; right: 12px; bottom: 14px; font: 400 11px var(--font-mono); opacity: .8; display: flex; justify-content: space-between; gap: 10px; }
.screen .q { position: absolute; left: 12px; right: 12px; top: 10px; font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; opacity: .85; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.18); }
.bar i { display: block; height: 100%; width: 0; background: var(--blue); }
.bar i.run { transition: width 6s linear; width: 100%; }
.frags { display: flex; flex-wrap: wrap; gap: 6px; }
.frag { background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; text-align: left; line-height: 1.3; }
.frag b { font: 500 11px var(--font-mono); display: block; }
.frag[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.about { font-size: 13px; margin: 0; }
.src { font-size: 12px; color: var(--muted); margin: 0; }
.src a { color: var(--blue); text-decoration: underline; text-underline-offset: 2px; }
.questions { display: grid; gap: 6px; align-content: start; min-width: 0; }
.questions > .mono { color: var(--muted); }
.qb { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 12px; cursor: pointer; font-weight: 500; line-height: 1.3; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.qb i { font: 400 11px var(--font-mono); color: var(--muted); font-style: normal; flex: none; }
.qb:hover { border-color: var(--ink); }
.qb[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.qb[aria-pressed="true"] i { color: rgba(255,255,255,.85); }
:root[data-theme="dark"] .qb[aria-pressed="true"] { color: #0e1014; } :root[data-theme="dark"] .qb[aria-pressed="true"] i { color: rgba(14,16,20,.7); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .qb[aria-pressed="true"] { color: #0e1014; } :root:not([data-theme="light"]) .qb[aria-pressed="true"] i { color: rgba(14,16,20,.7); } }

.row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.box { border: 1.5px solid var(--line); padding: 16px 14px 12px; background: var(--card); min-width: 0; }
.box h4 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.box.ad { border: 1.5px dashed var(--amber); background: var(--amber-soft); }
.box.shop { border-color: var(--amber); }
.box.st { border-color: var(--ink); }
.box.wide { grid-column: span 2; }
.shelf { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.book { margin: 0; opacity: .45; transition: opacity .15s; }
.book.rel { opacity: 1; }
.book img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); }
.book.rel img { outline: 3px solid var(--blue); outline-offset: 1px; }
.book figcaption { font-size: 11px; line-height: 1.3; margin-top: 5px; }
.book figcaption b { display: block; font-weight: 600; }
.book figcaption span { color: var(--muted); }
.book .badge { display: none; margin-top: 3px; font: 500 10px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--blue); }
.book.rel .badge { display: block; }
.mini { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
.btn { display: inline-block; margin-top: 8px; font-weight: 600; font-size: 12px; padding: 6px 10px; border: 1.5px solid var(--ink); border-radius: 6px; }
.patreon { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; border: 1.5px solid var(--blue); padding: 18px 14px 14px; background: var(--blue-soft); }
.patreon b { font-weight: 600; }
.patreon .btn { margin: 0; }

.money { display: grid; gap: 8px; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1.2fr) 24px minmax(0, 1fr); gap: 8px; align-items: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; text-align: left; width: 100%; }
.mrow:hover, .mrow[aria-pressed="true"] { border-color: var(--amber); background: var(--amber-soft); }
.mrow .arrow { color: var(--amber); font-weight: 800; text-align: center; }
.mrow small { display: block; color: var(--muted); font-size: 12px; }
.mrow b { font-weight: 600; }
.hint { color: var(--muted); font-size: 12px; margin-top: 6px; }

.mapwrap { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; overflow-x: auto; }
.mapwrap svg { display: block; min-width: 760px; width: 100%; height: auto; }
.mapwrap text { font-family: var(--font-text); fill: var(--ink); font-size: 13px; }
.mapwrap .t-mono { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; fill: var(--muted); }
.mapwrap .t-b { font-weight: 600; }
.mapwrap .lbl { font-size: 11px; fill: var(--muted); paint-order: stroke; stroke: var(--card); stroke-width: 4px; }
.mapnote { margin-top: 12px; display: grid; gap: 4px; color: var(--muted); max-width: 80ch; }
.foot { margin-top: 10px; color: var(--muted); font-size: 12px; max-width: 86ch; }

@media (max-width: 900px) {
  .module { grid-template-columns: 1fr; }
  .arow { grid-template-columns: 1fr; }
  .mrow { grid-template-columns: 1fr; }
  .mrow .arrow { transform: rotate(90deg); }
  .wall { margin-left: 0; }
  .step { grid-template-columns: 1fr; }
  .step > .num, .rail::before { display: none; }
  .row, .row2 { grid-template-columns: 1fr; }
  .box.wide { grid-column: auto; }
  .tx .cue { grid-template-columns: 62px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .bar i.run { transition: none; } .area, .book { transition: none; } }

/* вкладка «Форматы и формулы» */
.lnk { background: none; border: 0; padding: 0; color: var(--blue); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font: inherit; }
.ports { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.port { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; }
.port b { display: block; font-weight: 800; font-size: 15px; line-height: 1.25; }
.port span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.port i { font: 500 11px var(--font-mono); font-style: normal; color: var(--muted); display: block; margin-top: 8px; }
.port:hover { border-color: var(--ink); }
.port[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.port.mission { border-top: 5px solid var(--blue); } .port.inventory { border-top: 5px solid var(--amber); } .port.own { border-top: 5px solid var(--ink); }
.ffilter { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 14px; }
.chipbtn { border: 1.5px solid var(--line); background: transparent; border-radius: 100px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.chipbtn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-bottom: 18px; }
.fcard { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 12px 10px; cursor: pointer; display: grid; gap: 5px; align-content: start; min-width: 0; }
.fcard:hover { border-color: var(--ink); }
.fcard[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.fcard b { font-weight: 600; font-size: 14px; line-height: 1.3; }
.fcard small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.fcard .row-t { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.tg { font: 500 10px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.tg.ok { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
.tg.warn { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
.fpanel { background: var(--card); border: 1.5px solid var(--ink); border-radius: 14px; padding: 16px; display: grid; gap: 14px; margin-bottom: 28px; }
.fpanel h3 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; }
.fpanel .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: 13px; }
.fpanel .meta b { color: var(--ink); font-weight: 600; }
.fx { font: 400 12px/1.6 var(--font-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fcalc { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.fin { display: grid; gap: 8px; align-content: start; }
.fin label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.fin input { font: 500 14px var(--font-mono); color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; min-width: 0; }
.fin input:focus-visible { outline: 3px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
.fin input::placeholder { color: var(--line); }
.fres { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 6px; align-content: start; font-size: 13px; }
.fres .ln { display: flex; justify-content: space-between; gap: 12px; }
.fres .ln span:last-child { font: 500 13px var(--font-mono); font-variant-numeric: tabular-nums; }
.fres .tot { border-top: 1.5px solid var(--ink); padding-top: 8px; margin-top: 4px; font-weight: 800; font-size: 15px; }
.fres .tot span:last-child { font: 800 16px var(--font-mono); }
.fres .neg { color: var(--amber); }
.fres .empty { color: var(--muted); }
.fnote { color: var(--muted); font-size: 12px; margin: 0; }
.fh { font-size: 19px; font-weight: 800; margin: 0 0 6px; }
.deal { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 13px; margin-bottom: 26px; }
.deal th, .deal td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.deal th { font: 500 11px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--bg); }
.deal td:first-child { font-weight: 600; white-space: nowrap; }
.dealwrap { overflow-x: auto; }
.pilots { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 14px; }
.pilot { background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; align-content: start; font-size: 13px; }
.pilot.first { border-color: var(--blue); }
.pilot h4 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.3; }
.pilot small { color: var(--muted); font-size: 12px; line-height: 1.4; }
@media (max-width: 900px) { .ports { grid-template-columns: 1fr; } .fcalc { grid-template-columns: 1fr; } }
.vh { font-size: clamp(22px, 3.4vw, 32px); font-weight: 800; line-height: 1.15; margin: 0 0 8px; letter-spacing: -.01em; text-wrap: balance; }
.next { margin: 18px 0 0; font-weight: 600; }
.mpanel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; min-height: 118px; }
.mpanel h3 { margin: 4px 0 6px; font-size: 18px; font-weight: 800; line-height: 1.25; }
.mpanel p { margin: 0 0 6px; max-width: 78ch; }
.mnode { cursor: pointer; }
.mnode:hover rect { stroke: var(--ink); }
.mnode:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.mapwrap .lbl { font-size: 11px; }

2 классов, в российской системе,"]]}, {"ep": 3, "a": 3057, "b": 3141, "who": "консультант по поступлению в Гарвард", "quote": "В Америке это так не работает… Если вы не озадачились этим за несколько лет, желательно до начала старшей школы…", "sum": "Нельзя закончить школу и потом подать документы: готовиться нужно за несколько лет.", "cues": [[3057, "давайте начинать готовиться."], [3058, "Я говорю, все уже, поезд ушел. Они говорят,"], [3061, "подождите, ну как же так? Как же, у нас же принято,"], [3064, "закончил школу, потом подаешь документы и уже"], [3068, "с осени начинаешь учиться. В Америке это так"]]}]}, {"q": "Что с видом на жительство после учёбы?", "books": [], "frags": [{"ep": 0, "a": 1453, "b": 1539, "who": "Илья Кирия", "quote": "Если ты здесь отучился и получил французский диплом, то можно за два года получить ВНЖ.", "sum": "Французский диплом помогает получить ВНЖ: по его словам, за два года. Обычно нужна ещё и работа.", "cues": [[1453, "что они находятся временно здесь, тут временное пребывание."], [1458, "А в стаж, который нужен для ПМЖ и для получения гражданства,"], [1461, "студенческий вид на жительство засчитывается,"], [1463, "или там потом все обнуляется, и нужно начинать"], [1466, "с рабочим ВНЖ заново? Там хитро, нужно иметь"]]}]}, {"q": "Признают ли диплом и что дальше?", "books": [], "frags": [{"ep": 1, "a": 2342, "b": 2422, "who": "Ася Бурмистрова", "quote": "Этот диплом все европейские страны принимают, тоже Америка спокойно принимает.", "sum": "Бакалавр на 180 кредитов подходит под условия европейских магистратур. На практике она это ещё проверит.", "cues": [[2342, "И он вам зачем? Что вы с этим дальше будете делать?"], [2345, "Какой это вообще диплом? У меня в дипломе"], [2348, "будет написано, что я получила бакалаврскую"], [2351, "степень Liberal Arts and Sciences с мейджором"], [2355, "в Political Science. И с этим дипломом я планирую"]]}]}, {"q": "Как устроена жизнь студента: жильё и первое время?", "books": [], "frags": [{"ep": 1, "a": 866, "b": 958, "who": "Никита Богомолов", "quote": "Подавляющее большинство студентов снимают вдвоем.", "sum": "Чаще всего студенты снимают жильё вдвоём: так выгоднее, чем жить одному.", "cues": [[866, "что, скорее всего, визы все-таки введут."], [867, "Но для студентов, которые официально учатся,"], [870, "это не помеха. С жильем, я так понимаю, вы"], [873, "снимаете как? Вы снимаете вместе с другими студентами?"], [876, "Или каждый снимает свое? Как вообще?"]]}, {"ep": 1, "a": 997, "b": 1074, "who": "Никита Богомолов", "quote": "Мы не раз принимали у себя на первую неделю каких-то студентов, которые только приехали", "sum": "Администрация помогает с жильём и документами, а студенты принимают новичков на первую неделю.", "cues": [[997, "с тем, что ну сами там что-нибудь найдите."], [999, "То есть какая-то помощь от администрации"], [1001, "происходит с поиском жилья, с оформлением документов,"], [1004, "вот со всеми этими вопросами, да? Да, абсолютно."], [1007, "Более того, если, допустим..."]]}, {"ep": 4, "a": 1397, "b": 1481, "who": "студентка Стэнфорда", "quote": "Кампус огромный. Такое государство в государстве.", "sum": "Первое время почти всё происходит на кампусе: там есть всё нужное.", "cues": [[1397, "культурный шок? Вот что больше всего вас удивило?"], [1400, "Я пока сейчас просто про страну говорю, пока"], [1403, "не про Стэнфорд. Может быть, к чему было трудно"], [1405, "как-то привыкнуть, адаптироваться? Да, это"], [1407, "хороший вопрос, потому что тут есть еще одна"]]}]}], "books": false, "lead": "Шесть выпусков подкаста «Как поступать» превращаются в одну страницу для старшеклассников и их родителей: деньги, шансы, сроки, документы и жизнь студента. Консультанты, преподаватель и студенты отвечают на вопросы из списка справа.", "sponsor": "агентство по поступлению", "adTitle": "агентства по поступлению, языковые школы, банки для студентов", "checklist": "Чек-лист: сроки и документы для поступления", "event": "Тематическая встреча: поступаем не в России", "archiveSub": "Здесь шесть выпусков подкаста «Как поступать»: консультанты, преподаватель и студенты рассказывают про Францию, Чехию, Черногорию, Гарвард и Стэнфорд. Синие куски на таймлайне это места, где говорят о выбранном вопросе. Нажмите на кусок, чтобы увидеть его в плеере.", "more": "Ещё два выпуска о российском высшем образовании сюда не вошли.", "foot": "Фрагменты, тайм-коды и цитаты взяты из выгрузки субтитров шести выпусков. Партнёры показаны как пример. Субтитры распознаны автоматически, поэтому написание имён стоит сверить перед показом.", "ids": ["iwdLRb3AHp0", "RS55nBVTErI", "b4VxcXpEIF4", "uloY0890uyE", "-B-5zjnwzwo", "UNQ-YIHk5jc"]}], "books": [{"t": "Звонок для родителя", "a": "Кристина Сандалова", "img": "data:image/webp;base64,UklGRmq4AABXRUJQVlA4IF64AACQuQKdASpYAoMDPm0ylUekIqShp5HrUJANiU3e/WkL3IXcUd6NLoFjf8n/uv8L208m+efzv97/yX/e/w/vNcd9lHnD73/j/93/cfma/m9uPYvmJeffuv/b/xP+m/cj54/63/x/43/R/Cv+kf6L/2f6H9//oH/Wn9if9r6WPvI/eL1QfuL+4X/2+Gn/n/un7/f6n/yvYm/o3+9////Q7Yv0Pv3H///s6/+H95//v8x39h/5P7rf/b5Zf3D//+r+eh/8d/iP2o98nx/9u/xX+E/yf+5/w3/X8zP2D+L/uP+W/2P+J/bP7oPyrQv2r/9von/K/up+j/w3+f/6X+O/df7x/1v/J/z37o/5r9nfZ/5uf7/qC/lP88/0X99/cP/FfvB7xe0zuj/zvUF9yPtX/I/xP+l/+X+g+Gv6T/hf5T95/eP7H/9L/Ffut9AX8//s3+t/x372/5X///Zv/a/7XjT/mv+N+4HwBfy3+x/8v/Ef7j9wfp0/tf/d/pP9z+6nuq/Sv89/6/9H/tfkU/nf9u/5n+G/LL/////72//j7uf2x/+Huv/sz/3DZOKhKVWBw++HIpCAEqt3dy8sW3gwYV8XnQhNpdvvCCBvGoXiwPmM5ubOHDW0kdx7z6K5cN32iCpLuj1htpJ+qgX3L09fOV82ni+5emXieR8iVXDj4UOfsp48sot7LAwM/OKecOu0mrx8pzB/ER/JcnHcCKDVdSV7GoLPVLffsUaziMgJUCZMiaLuVBW17bZJ/kVR7LumejgS/w1tJKec6eYNaebfIw0lHPgI5Dr3QiFaRcqcc0cYU/SoZ/jtbPu8IyxnP89BmuwBHICW1rQCl4oMRoWeVvI9odj1C4pBWTS20Mu+cJ9YgIGw2kWEd+H9m+/Dh0/7RJ1fwZp9JU4hraRUsiwGqU9koPV3xQqO5TPXkCLfoaVsqts7I5lTniq2TQXP/kBMagehiY0YPJ3lBl75J6S2EgpZj1qhXI1ayINJwwVVXPG8oDtJlmqhzn3/FtVaVworm3OhEny0HWfqmkhamgQ2t/AVHka5n3lnGzBobUg+s8KLlnCBIbUeaOuo2VgQ+EVsv5LFTiBijKx/N/BpwzXSKHK3AXs6NlGEv0QnuswX9qpJHzPw4Jn/AzBPrH1hNtwLUJdK40qxWzJXCevqfgbyKtuMnxuF2TUdKl+p90GYgfy3KqLvCx7dB+N function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function low(s){return s.charAt(0).toLowerCase()+s.slice(1)}
function hms(sec){var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function cur(){var S=SH[si],q=S.q[qi],f=q.frags[fi];return{S:S,q:q,f:f,ep:S.eps[f.ep],vid:S.ids[f.ep]}}
function yurl(c){return 'https://www.youtube.com/watch?v='+c.vid+'&t='+c.f.a+'s'}
var shpick=$('shpick');
SH.forEach(function(s,i){var b=document.createElement('button');b.className='tab';b.type='button';b.textContent=s.tab;b.setAttribute('aria-pressed',i===0);b.onclick=function(){si=i;qi=0;fi=0;build()};shpick.appendChild(b)});
$('mapbtn').onclick=function(){var on=!document.body.classList.contains('showmap');document.body.classList.toggle('showmap',on);this.setAttribute('aria-pressed',on)};
function tag(n){return '<span class="map">'+n+'</span>'}

function killPlayer(){if(player){try{player.destroy()}catch(e){}}player=null;playerVid=null;ready=false;pendingPlay=false}

function build(){
 killPlayer();
 var S=SH[si];
 var tabs=shpick.querySelectorAll('.tab');for(var i=0;i<tabs.length;i++)tabs[i].setAttribute('aria-pressed',i===si);
 $('foot').textContent=S.foot;
 var m='<div class="page"><div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url">ваш-сайт / razberemsya / '+esc(S.url)+'</div></div><div class="pbody">';
 m+='<div class="ptitle"><h3>Давайте разберёмся: '+esc(S.label)+'</h3><span class="mono" style="color:var(--muted)">витрина</span></div>';
 m+='<div class="area slotarea sponsor"><span class="tag ad">Деньги · титульный партнёр'+tag(1)+'</span><span>Партнёр витрины: <b>'+esc(S.sponsor)+'</b> (пример)</span><span>маркировка «реклама» и ссылка</span></div>';
 m+='<div class="area module"><span class="tag ed">Редакция · интерактивью</span><div class="player">';
 m+='<div class="vq" id="vq"></div><div class="vid"><div id="yt"></div><button class="cover" id="cover" type="button"><img id="thumb" alt=""><span class="pl"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></span><span class="cl" id="cl"></span></button><div class="err" id="err" hidden></div></div>';
 m+='<div class="vcap"><span id="cw"></span><span id="ct"></span></div><div class="frags" id="frags"></div>';
 m+='<p class="quote" id="quote"></p><p class="about" id="about"></p><p class="src" id="src"></p>';
 m+='<div class="ctx area slotarea"><span class="tag ad">Реклама · контекстный блок к вопросу'+tag(3)+'</span><b>'+esc(cap(S.adTitle))+'</b><div class="mini">Партнёр показывается рядом с ответом на этот вопрос и подписан «реклама». Не в эфире.</div></div>';
 m+='</div><div class="side"><div class="questions" id="qlist"><span class="mono">Вопросы</span></div>';
 m+='<div class="slot rect area slotarea"><span class="tag ad">Деньги · слот «реклама»'+tag(2)+'</span>Реклама: '+esc(S.adTitle)+'<small>300 × 250 · под списком вопросов · фиксированный пакет</small></div></div></div>';
 var chk='<div class="area box st"><span class="tag st">Продакшен-студия</span><h4>'+esc(S.checklist)+'</h4><p class="mini">Делает коммерческая редакция без журналистов.</p><span class="btn">Скачать</span></div>';
 var evt='<div class="area box shop slotarea"><span class="tag ad">Деньги · билеты'+tag(5)+'</span><h4>'+esc(S.event)+'</h4><p class="mini">Если встречи нет, здесь стоит мерч.</p><span class="btn">Купить билет</span></div>';
 if(S.books){m+='<div class="row"><div class="area box shop wide slotarea"><span class="tag ad">Деньги · книжный магазин'+tag(4)+'</span><h4>Книги по теме</h4><div class="shelf">'+BOOKS.map(function(b,bi){return '<figure class="book" data-b="'+bi+'"><img src="'+b.img+'" alt="Обложка: '+esc(b.t)+'"><figcaption><b>'+esc(b.t)+'</b><span>'+esc(b.a)+'</span><span class="badge">к этому вопросу</span></figcaption></figure>'}).join('')+'</div></div>'+chk+evt+'</div>'}
 else m+='<div class="row2">'+chk+evt+'</div>';
 m+='<div class="area slot lb slotarea"><span class="tag ad">Деньги · баннер'+tag(6)+'</span>Реклама: '+esc(S.adTitle)+'<small>728 × 90 · перед подвалом · показы по CPM</small></div>';
 m+='<div class="area patreon"><span class="tag ed">Донаты</span><span><b>Журналистика держится на читателях.</b> Поддержите редакцию на Patreon.</span><span class="btn">Поддержать</span></div>';
 m+='</div></div>';
 $('story').innerHTML=m;
 $('slots').innerHTML='<b>Рекламные места на витрине</b><ol><li><b>Титульный партнёр</b>: строка над плеером, продаётся на сезон темы, фиксированная цена.</li><li><b>Прямоугольник 300×250</b>: под списком вопросов, первый экран на компьютере.</li><li><b>Контекстный блок</b>: под ответом, меняется вместе с вопросом, цена выше за точность.</li><li><b>Магазин</b>: книги и партнёрские ссылки, комиссия с продаж.</li><li><b>Билеты и мерч</b>: продажи мероприятия.</li><li><b>Баннер 728×90</b>: перед подвалом, остаток инвентаря по CPM.</li></ol><p class="mini">Рекламы внутри видео и внутри ответов нет: плеер показывает только слова спикеров.</p>';
 $('cover').onclick=function(){go(fi,true)};
 update();
 $('cover').hidden=true;
 initPlayer();
}

function update(){
 var c=cur(),S=c.S;startedKey=si+'-'+qi+'-'+fi;
 $('vq').textContent='Вопрос: '+c.q.q;
 $('cw').textContent=c.f.who;$('ct').textContent=hms(c.f.a)+'–'+hms(c.f.b);
 $('quote').textContent='«'+c.f.quote+'»';
 $('about').textContent=cap(c.f.who)+': '+low(c.f.sum);
 $('src').innerHTML='Источник: «'+esc(c.ep.t)+'», '+esc(c.ep.show)+'. <a href="'+yurl(c)+'" target="_blank" rel="noopener">Смотреть эфир с этого места</a>';
 $('thumb').src='https://i.ytimg.com/vi/'+c.vid+'/hqdefault.jpg';
 $('cl').textContent='Смотреть с '+hms(c.f.a);
 $('frags').innerHTML=c.q.frags.map(function(x,k){return '<button class="frag" data-k="'+k+'" aria-pressed="'+(k===fi)+'"><b>'+(k+1)+' · '+hms(x.a)+'</b>'+esc(x.who)+'</button>'}).join('');
 $('qlist').innerHTML='<span class="mono">Вопросы</span>'+S.q.map(function(x,i){return '<button class="qb" data-q="'+i+'" aria-pressed="'+(i===qi)+'"><span>'+esc(x.q)+'</span><i>'+x.frags.length+'</i></button>'}).join('');
 var books=$('story').querySelectorAll('.book');for(var i=0;i<books.length;i++)books[i].classList.toggle('rel',c.q.books.indexOf(i)>=0);
 var fr=$('frags').querySelectorAll('.frag');for(i=0;i<fr.length;i++)fr[i].onclick=function(){go(+this.getAttribute('data-k'),true)};
 var qb=$('qlist').querySelectorAll('.qb');for(i=0;i<qb.length;i++)qb[i].onclick=function(){qi=+this.getAttribute('data-q');go(0,true)};
}

function go(k,play){
 fi=k;update();
 if(play){playFrag()}
 else{try{if(player&&player.pauseVideo)player.pauseVideo()}catch(e){}$('cover').hidden=false;$('err').hidden=true}
}

function showErr(){var c=cur(),e=$('err');if(!e)return;e.hidden=false;e.innerHTML='<div>Плеер YouTube не запустился.</div><a href="'+yurl(c)+'" target="_blank" rel="noopener">Смотреть с '+hms(c.f.a)+' на YouTube</a>'}

function withApi(cb){
 if(apiState===2){cb();return}
 apiQueue.push(cb);
 if(apiState===1)return;
 apiState=1;
 window.onYouTubeIframeAPIReady=function(){apiState=2;var q=apiQueue;apiQueue=[];q.forEach(function(f){f()})};
 var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=showErr;document.head.appendChild(s);
}

function dbg(x){(window.__dbg=window.__dbg||[]).push(x)}
function initPlayer(){
 withApi(function(){
  if(player)return;
  var c=cur();playerVid=c.vid;
  player=new YT.Player('yt',{width:'100%',height:'100%',videoId:c.vid,
   playerVars:{controls:1,rel:0,modestbranding:1,playsinline:1,start:c.f.a},
   events:{onReady:function(e){ready=true;if(pendingPlay){pendingPlay=false;playFrag()}else{var c2=cur();playerVid=c2.vid;e.target.cueVideoById({videoId:c2.vid,startSeconds:c2.f.a})}},
    onStateChange:function(e){dbg('state '+e.data+' t='+Math.round(e.target.getCurrentTime()))},
    onError:showErr}});
 });
}
function playFrag(){
 var c=cur();dbg('playFrag '+si+'-'+qi+'-'+fi);
 startedKey=si+'-'+qi+'-'+fi;advKey='';armed=false;
 $('cover').hidden=true;$('err').hidden=true;
 if(!player||!ready){pendingPlay=true;initPlayer();return}
 var a=c.f.a;
 if(playerVid===c.vid){
  dbg('seek '+a);
  var wasPaused=player.getPlayerState&&player.getPlayerState()===2;
  player.seekTo(a,true);
  // A seek resumes a playing or cued video. Only a paused player needs playVideo().
  if(wasPaused)player.playVideo();
 }
 else{playerVid=c.vid;dbg('load '+c.vid+' '+a);player.loadVideoById({videoId:c.vid,startSeconds:a})}
}

setInterval(function(){
 try{
  if(!player||!player.getPlayerState)return;
  var c=cur(),key=si+'-'+qi+'-'+fi,st=player.getPlayerState();
  if(key!==startedKey||advKey===key||playerVid!==c.vid)return;
  var t=player.getCurrentTime();
  if(!armed){if(st===1&&t>=c.f.a-1&&t<c.f.b-1)armed=true;return}
  var done=(st===1&&t>=c.f.b)||(st===0&&t>=c.f.b-2);
  if(!done)return;
  advKey=key;dbg('advance from '+key);
  if(fi<c.q.frags.length-1){go(fi+1,true)}else{try{player.pauseVideo()}catch(e){}}
 }catch(e){}
},250);

build();
})();
</script></body></html>
